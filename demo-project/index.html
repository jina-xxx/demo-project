<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo: History, Canvas, Web Worker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Демо: History API, Canvas, Web Worker</h1>

  <!-- 1. История браузера -->
  <section>
    <h2>1. История браузера</h2>
    <p>Текущее состояние: <span id="history-state">нет состояния</span></p>
    <button id="btn-push">Push State (новая страница)</button>
    <button id="btn-back">Назад</button>
    <button id="btn-forward">Вперед</button>
  </section>

  <!-- 2. Canvas и анимация -->
  <section>
    <h2>2. Canvas и анимация</h2>
    <canvas id="canvas" width="400" height="300"></canvas>
    <p>Анимация работает через requestAnimationFrame. Объекты реагируют на мышь.</p>
  </section>

  <!-- 3. Web Workers -->
  <section>
    <h2>3. Web Workers</h2>
    <label for="worker-input">Число для факториала:
      <input type="number" id="worker-input" value="10000" min="0" step="1" />
    </label>
    <button id="btn-worker">Запустить тяжёлые вычисления</button>
    <div id="worker-status" class="status">Ожидание...</div>
    <p><small>Воркер выполняет вычисления в фоне, не блокируя UI.</small></p>
  </section>

  <script src="main.js"></script>
</body>
</html>
